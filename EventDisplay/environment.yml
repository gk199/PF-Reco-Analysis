# Directions:
#   conda env create -f environment.yml
#   conda activate PFEventDisplay

name: PFEventDisplay

channels:
  - conda-forge
  - defaults

dependencies:
  # Core runtime
  - python=3.9
  - pip

  # Use numpy<2 for awkward==2.6.2 compatibility
  - numpy<2
  - scipy
  - matplotlib
  - pillow

  # Everything that was "pypi_0":
  - pip:
      - awkward==2.6.2
      - awkward-cpp==30
      - uproot==5.3.1
      - cramjam==2.8.2
      - fsspec==2024.2.0
      - importlib-metadata==7.0.2
      - typing-extensions==4.10.0
      - zipp==3.17.0

      # PyQt (matching your package-list pins)
      - pyqt5==5.15.10
      - pyqt5-qt5==5.15.12
      - pyqt5-sip==12.13.0
